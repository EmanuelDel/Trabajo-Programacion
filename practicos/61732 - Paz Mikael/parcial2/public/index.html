<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mostrador — Sistema de Gestión Comercial</title>
  
  <!-- Tipografía moderna Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <!-- React 18 y Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg-app: #f8fafc;
      --sidebar-bg: #0f172a;
      --sidebar-hover: #1e293b;
      --sidebar-active: #2563eb;
      --brand-accent: #38bdf8;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --card-bg: #ffffff;
      --danger: #ef4444;
      --danger-bg: #fef2f2;
      --success: #10b981;
      --success-bg: #ecfdf5;
      --warning: #f59e0b;
      --warning-bg: #fffbeb;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.07);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg-app);
      color: var(--text-main);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Layout general */
    .app-layout {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 250px 1fr;
    }

    @media (max-width: 960px) {
      .app-layout { grid-template-columns: 1fr; }
      .sidebar { display: none; }
    }

    /* Barra lateral */
    .sidebar {
      background: var(--sidebar-bg);
      color: #f1f5f9;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      border-right: 1px solid #1e293b;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 19px;
      letter-spacing: -0.5px;
      padding: 0 8px;
    }

    .brand-mark {
      background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
      color: #fff;
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      font-weight: 800;
      font-size: 19px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
    }

    .brand-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.4px;
    }

    .brand-title small {
      display: block;
      font-size: 10px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #94a3b8;
      font-weight: 600;
      margin-top: 1px;
    }

    .nav-label {
      text-transform: uppercase;
      letter-spacing: 1.2px;
      font-size: 10.5px;
      font-weight: 700;
      color: #64748b;
      margin: 0 10px 8px;
    }

    .nav-group { display: grid; gap: 4px; }
    .nav-item {
      border: 0;
      background: transparent;
      color: #94a3b8;
      text-align: left;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 13.5px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.15s ease;
      width: 100%;
    }
    .nav-item:hover { background: var(--sidebar-hover); color: #fff; }
    .nav-item.active {
      background: var(--sidebar-active);
      color: #fff;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }
    .nav-icon { font-size: 16px; width: 22px; text-align: center; }

    .sidebar-footer {
      margin-top: auto;
      border-top: 1px solid #1e293b;
      padding: 16px 8px 0;
      color: #64748b;
      font-size: 11.5px;
      line-height: 1.5;
    }

    /* Cabecera superior */
    .topbar {
      height: 64px;
      border-bottom: 1px solid var(--border-color);
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
    }

    .user-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 13.5px;
    }

    .user-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #e2e8f0;
      color: #1e293b;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 12px;
    }

    .btn-logout {
      background: transparent;
      border: 1px solid var(--border-color);
      color: #64748b;
      padding: 6px 14px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 600;
      margin-left: 14px;
      transition: all 0.15s;
    }
    .btn-logout:hover { background: var(--danger-bg); color: var(--danger); border-color: #fca5a5; }

    /* Área de Contenido */
    .main-content {
      padding: 28px 32px 40px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .heading-page {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 24px;
      gap: 16px;
      flex-wrap: wrap;
    }

    .heading-page h1 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 26px;
      font-weight: 800;
      margin: 0;
      color: var(--text-main);
      letter-spacing: -0.6px;
    }

    .heading-page p {
      margin: 4px 0 0;
      color: var(--text-muted);
      font-size: 13.5px;
    }

    /* Tarjetas de Estadísticas (KPIs) */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .kpi-card {
      background: #fff;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 18px 20px;
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      gap: 16px;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .kpi-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }

    .kpi-icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .kpi-icon.blue { background: #eff6ff; color: #2563eb; }
    .kpi-icon.green { background: #ecfdf5; color: #10b981; }
    .kpi-icon.amber { background: #fffbeb; color: #f59e0b; }
    .kpi-icon.purple { background: #f5f3ff; color: #8b5cf6; }

    .kpi-label { font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 2px; }
    .kpi-value { font-size: 20px; font-weight: 800; color: var(--text-main); font-family: 'Plus Jakarta Sans', sans-serif; }

    /* Botones generales */
    .btn {
      border: 0;
      border-radius: var(--radius-sm);
      padding: 9px 16px;
      font-weight: 600;
      font-size: 13px;
      background: var(--primary);
      color: #fff;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .btn:hover:not(:disabled) { background: var(--primary-hover); transform: translateY(-1px); }
    .btn-secondary {
      background: #fff;
      color: #334155;
      border: 1px solid var(--border-color);
    }
    .btn-secondary:hover:not(:disabled) { background: #f8fafc; color: #0f172a; }
    .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: var(--radius-sm); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover:not(:disabled) { background: #dc2626; }

    /* Tarjetas y Contenedores */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    .card-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #ffffff;
    }

    .card-header h2 {
      font-size: 15px;
      margin: 0;
      font-weight: 700;
      color: var(--text-main);
    }

    .card-body { padding: 20px; }

    /* Tablas */
    .table-container { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      white-space: nowrap;
    }

    th {
      font-size: 11px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #64748b;
      font-weight: 700;
      background: #f8fafc;
      padding: 12px 18px;
      border-bottom: 1px solid var(--border-color);
    }

    td {
      padding: 13px 18px;
      border-bottom: 1px solid var(--border-color);
      font-size: 13.5px;
    }

    tr:last-child td { border-bottom: 0; }
    tr:hover td { background: #f8fafc; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 9999px;
      font-size: 11.5px;
      font-weight: 600;
    }
    .badge-success { background: var(--success-bg); color: #065f46; }
    .badge-danger { background: var(--danger-bg); color: #991b1b; }
    .badge-warning { background: var(--warning-bg); color: #92400e; }
    .badge-neutral { background: #f1f5f9; color: #475569; }

    /* Buscador */
    .toolbar-search {
      display: flex;
      gap: 12px;
      margin-bottom: 18px;
      align-items: center;
      flex-wrap: wrap;
    }
    .input-search {
      min-width: 280px;
      height: 40px;
      padding: 0 14px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      background: #fff;
      font-size: 13.5px;
      color: var(--text-main);
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .input-search:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    /* Grid para vista de Mostrador */
    .pos-grid {
      display: grid;
      grid-template-columns: 1.6fr 1fr;
      gap: 24px;
      align-items: start;
    }

    @media (max-width: 1024px) {
      .pos-grid { grid-template-columns: 1fr; }
    }

    /* Modales */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(3px);
      display: grid;
      place-items: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-card {
      background: #fff;
      border-radius: var(--radius-lg);
      max-width: 540px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      animation: modalFadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.96) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
    }
    .modal-header h3 { margin: 0; font-size: 16px; font-weight: 700; color: var(--text-main); }
    .modal-close { background: transparent; border: 0; font-size: 20px; color: #94a3b8; }
    .modal-close:hover { color: var(--danger); }
    .modal-body { padding: 24px; }
    .modal-footer {
      padding: 16px 24px;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      background: #f8fafc;
    }

    /* Formularios */
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 6px;
    }
    .form-control {
      width: 100%;
      height: 40px;
      padding: 0 12px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      background: #fff;
      color: var(--text-main);
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }
    textarea.form-control { height: 80px; padding: 10px 12px; }

    /* Alertas Toast */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 2000;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .toast {
      background: #fff;
      border-left: 4px solid var(--primary);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15);
      border-radius: var(--radius-sm);
      padding: 14px 18px;
      min-width: 300px;
      max-width: 420px;
      font-size: 13.5px;
      display: flex;
      align-items: center;
      gap: 12px;
      animation: slideIn 0.25s ease-out;
    }
    .toast.error { border-left-color: var(--danger); }
    .toast.success { border-left-color: var(--success); }

    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    /* Ticket de comprobante */
    @media print {
      body { background: #fff; font-size: 12px; }
      .sidebar, .topbar, .btn, .modal-close { display: none !important; }
      .modal-overlay { position: static; background: none; padding: 0; }
      .modal-card { box-shadow: none; border: 1px solid #ccc; max-width: 100%; }
      .comprobante-ticket { padding: 0; }
    }

    .ticket-head { text-align: center; border-bottom: 1px dashed #cbd5e1; padding-bottom: 16px; margin-bottom: 16px; }
    .ticket-title { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 20px; font-weight: 800; margin: 0; color: var(--text-main); }
    .ticket-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 13px; }
    .ticket-total { font-size: 18px; font-weight: 800; border-top: 1px dashed #cbd5e1; padding-top: 12px; margin-top: 12px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Utilidades de formato
    function formatoMoneda(centavos) {
      if (centavos === null || centavos === undefined) return '$ 0,00';
      const pesos = centavos / 100;
      return '$ ' + pesos.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function formatoFecha(iso) {
      if (!iso) return '-';
      const d = new Date(iso);
      return d.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    // App Principal
    function App() {
      const [usuario, setUsuario] = useState(null);
      const [cargandoSesion, setCargandoSesion] = useState(true);
      const [seccion, setSeccion] = useState('ventas');
      const [toasts, setToasts] = useState([]);
      const [metricas, setMetricas] = useState({ totalVentasCentavos: 0, stockBajoCount: 0, saldoDeudaCentavos: 0, productosCount: 0 });

      function mostrarToast(mensaje, tipo = 'success') {
        const id = Date.now() + Math.random();
        setToasts((prev) => [...prev, { id, mensaje, tipo }]);
        setTimeout(() => {
          setToasts((prev) => prev.filter((t) => t.id !== id));
        }, 4000);
      }

      function refrescarMetricas() {
        Promise.all([
          fetch('/api/ventas').then((r) => r.json()).catch(() => ({ datos: [] })),
          fetch('/api/productos').then((r) => r.json()).catch(() => ({ datos: [] })),
          fetch('/api/clientes').then((r) => r.json()).catch(() => ({ datos: [] }))
        ]).then(([ventasData, productosData, clientesData]) => {
          const totalV = (ventasData.datos || []).reduce((acc, v) => acc + (v.totalCentavos || 0), 0);
          const stockBajo = (productosData.datos || []).filter((p) => p.stockActual <= 3).length;
          const totalDeuda = (clientesData.datos || []).reduce((acc, c) => acc + (c.saldoCentavos || 0), 0);
          const prodsTotal = (productosData.datos || []).length;
          setMetricas({
            totalVentasCentavos: totalV,
            stockBajoCount: stockBajo,
            saldoDeudaCentavos: totalDeuda,
            productosCount: prodsTotal
          });
        });
      }

      useEffect(() => {
        fetch('/api/sesion')
          .then((res) => (res.ok ? res.json() : null))
          .then((data) => {
            if (data?.usuario) {
              setUsuario(data.usuario);
              refrescarMetricas();
            }
          })
          .catch(() => {})
          .finally(() => setCargandoSesion(false));
      }, []);

      async function cerrarSesion() {
        await fetch('/api/sesion', { method: 'DELETE' });
        setUsuario(null);
        mostrarToast('Sesión cerrada correctamente.');
      }

      if (cargandoSesion) {
        return (
          <div style={{ height: '100vh', display: 'grid', placeItems: 'center', color: '#64748b' }}>
            <p>Cargando sistema...</p>
          </div>
        );
      }

      if (!usuario) {
        return <VistaLogin onLogin={(u) => { setUsuario(u); refrescarMetricas(); mostrarToast(`Bienvenido, ${u.nombre}`); }} mostrarToast={mostrarToast} />;
      }

      return (
        <div className="app-layout">
          {/* Barra Lateral */}
          <aside className="sidebar">
            <div className="brand">
              <div className="brand-mark">M</div>
              <div className="brand-title">
                MOSTRADOR
                <small>Sistema de Ventas</small>
              </div>
            </div>

            <div className="nav-group">
              <div className="nav-label">Operaciones</div>
              <button className={`nav-item ${seccion === 'ventas' ? 'active' : ''}`} onClick={() => setSeccion('ventas')}>
                <span className="nav-icon">🛒</span> Nueva venta
              </button>
              <button className={`nav-item ${seccion === 'comprobantes' ? 'active' : ''}`} onClick={() => setSeccion('comprobantes')}>
                <span className="nav-icon">🧾</span> Comprobantes
              </button>
            </div>

            <div className="nav-group">
              <div className="nav-label">Inventario</div>
              <button className={`nav-item ${seccion === 'productos' ? 'active' : ''}`} onClick={() => setSeccion('productos')}>
                <span className="nav-icon">📦</span> Catálogo y stock
              </button>
              <button className={`nav-item ${seccion === 'movimientos' ? 'active' : ''}`} onClick={() => setSeccion('movimientos')}>
                <span className="nav-icon">📊</span> Auditoría de stock
              </button>
            </div>

            <div className="nav-group">
              <div className="nav-label">Finanzas</div>
              <button className={`nav-item ${seccion === 'clientes' ? 'active' : ''}`} onClick={() => setSeccion('clientes')}>
                <span className="nav-icon">👥</span> Clientes y Cta Cte
              </button>
            </div>

            {usuario.administrador && (
              <div className="nav-group">
                <div className="nav-label">Administración</div>
                <button className={`nav-item ${seccion === 'usuarios' ? 'active' : ''}`} onClick={() => setSeccion('usuarios')}>
                  <span className="nav-icon">🔐</span> Usuarios
                </button>
              </div>
            )}

            <div className="sidebar-footer">
              <strong>TUP 2026 — Programación IV</strong><br />
              Segundo Parcial Integrador<br />
              Mikael Paz · Legajo 61732
            </div>
          </aside>

          {/* Área Principal */}
          <main style={{ minWidth: 0, display: 'flex', flexDirection: 'column' }}>
            <header className="topbar">
              <div style={{ color: '#64748b', fontSize: '13px' }}>
                Mostrador Principal · Moneda: <strong>Pesos Argentinos (ARS)</strong>
              </div>
              <div style={{ display: 'flex', alignItems: 'center' }}>
                <div className="user-pill">
                  <div className="user-avatar">{usuario.nombre.substring(0, 2).toUpperCase()}</div>
                  <div>
                    <div>{usuario.nombre}</div>
                    <div style={{ fontSize: '11px', color: '#64748b' }}>
                      {usuario.administrador ? 'Administrador' : 'Operador'}
                    </div>
                  </div>
                </div>
                <button className="btn-logout" onClick={cerrarSesion}>Cerrar sesión</button>
              </div>
            </header>

            <div className="main-content">
              {/* Tarjetas de Métricas / KPIs */}
              <div className="kpi-grid">
                <div className="kpi-card">
                  <div className="kpi-icon blue">💰</div>
                  <div>
                    <div className="kpi-label">Total facturado</div>
                    <div className="kpi-value">{formatoMoneda(metricas.totalVentasCentavos)}</div>
                  </div>
                </div>
                <div className="kpi-card">
                  <div className="kpi-icon green">📦</div>
                  <div>
                    <div className="kpi-label">Productos en catálogo</div>
                    <div className="kpi-value">{metricas.productosCount}</div>
                  </div>
                </div>
                <div className="kpi-card">
                  <div className="kpi-icon amber">⚠️</div>
                  <div>
                    <div className="kpi-label">Stock bajo (≤ 3 u.)</div>
                    <div className="kpi-value">{metricas.stockBajoCount}</div>
                  </div>
                </div>
                <div className="kpi-card">
                  <div className="kpi-icon purple">💳</div>
                  <div>
                    <div className="kpi-label">Deuda en Cta Cte</div>
                    <div className="kpi-value">{formatoMoneda(metricas.saldoDeudaCentavos)}</div>
                  </div>
                </div>
              </div>

              {seccion === 'ventas' && (
                <VistaNuevaVenta
                  usuario={usuario}
                  mostrarToast={mostrarToast}
                  onVentaGuardada={() => {
                    refrescarMetricas();
                    setSeccion('comprobantes');
                  }}
                />
              )}
              {seccion === 'comprobantes' && <VistaComprobantes mostrarToast={mostrarToast} />}
              {seccion === 'productos' && <VistaProductos mostrarToast={mostrarToast} onActualizado={refrescarMetricas} />}
              {seccion === 'movimientos' && <VistaMovimientosStock mostrarToast={mostrarToast} />}
              {seccion === 'clientes' && <VistaClientes mostrarToast={mostrarToast} onActualizado={refrescarMetricas} />}
              {seccion === 'usuarios' && usuario.administrador && <VistaUsuarios mostrarToast={mostrarToast} usuarioActual={usuario} />}
            </div>
          </main>

          {/* Notificaciones Toast */}
          <div className="toast-container">
            {toasts.map((t) => (
              <div key={t.id} className={`toast ${t.tipo}`}>
                <span>{t.tipo === 'error' ? '⚠️' : '✅'}</span>
                <div>{t.mensaje}</div>
              </div>
            ))}

      );
    }

    // ----------------------------------------------------
    // VISTA 1: NUEVA VENTA (MOSTRADOR)
    // ----------------------------------------------------
    function VistaNuevaVenta({ usuario, mostrarToast, onVentaGuardada }) {
      const [clientes, setClientes] = useState([]);
      const [productos, setProductos] = useState([]);
      const [clienteId, setClienteId] = useState('');
      const [formaPago, setFormaPago] = useState('CONTADO');
      const [itemsVenta, setItemsVenta] = useState([]);
      const [productoSeleccionado, setProductoSeleccionado] = useState('');
      const [cargando, setCargando] = useState(false);
      const [modalNuevoCliente, setModalNuevoCliente] = useState(false);
      const [comprobanteGenerado, setComprobanteGenerado] = useState(null);

      useEffect(() => {
        fetch('/api/clientes')
          .then((r) => r.json())
          .then((d) => setClientes(d.datos || []));

        fetch('/api/productos?activo=true')
          .then((r) => r.json())
          .then((d) => setProductos(d.datos || []));
      }, []);

      const totalCentavos = useMemo(() => {
        return itemsVenta.reduce((acc, it) => acc + it.precioUnitarioCentavos * it.cantidad, 0);
      }, [itemsVenta]);

      function agregarProducto() {
        if (!productoSeleccionado) return;
        const prod = productos.find((p) => p.id === parseInt(productoSeleccionado, 10));
        if (!prod) return;

        if (prod.stockActual <= 0) {
          mostrarToast(`No hay existencias para ${prod.nombre}`, 'error');
          return;
        }

        const existe = itemsVenta.find((it) => it.productoId === prod.id);
        if (existe) {
          if (existe.cantidad >= prod.stockActual) {
            mostrarToast(`No podés agregar más unidades de ${prod.nombre}. Stock disponible: ${prod.stockActual}`, 'error');
            return;
          }
          setItemsVenta((prev) =>
            prev.map((it) => (it.productoId === prod.id ? { ...it, cantidad: it.cantidad + 1 } : it))
          );
        } else {
          setItemsVenta((prev) => [
            ...prev,
            {
              productoId: prod.id,
              descripcion: prod.nombre,
              precioUnitarioCentavos: prod.precioVentaCentavos,
              cantidad: 1,
              stockDisponible: prod.stockActual
            }
          ]);
        }
        setProductoSeleccionado('');
      }

      function cambiarCantidad(productoId, delta) {
        setItemsVenta((prev) =>
          prev
            .map((it) => {
              if (it.productoId === productoId) {
                const nuevaCant = it.cantidad + delta;
                if (nuevaCant > it.stockDisponible) {
                  mostrarToast(`Supera el stock disponible (${it.stockDisponible})`, 'error');
                  return it;
                }
                return { ...it, cantidad: nuevaCant };
              }
              return it;
            })
            .filter((it) => it.cantidad > 0)
        );
      }

      function quitarItem(productoId) {
        setItemsVenta((prev) => prev.filter((it) => it.productoId !== productoId));
      }

      async function confirmarVenta() {
        if (itemsVenta.length === 0) {
          mostrarToast('Agregá al menos un producto a la venta.', 'error');
          return;
        }
        if (formaPago === 'CUENTA_CORRIENTE' && !clienteId) {
          mostrarToast('La venta en cuenta corriente exige seleccionar un cliente registrado.', 'error');
          return;
        }

        setCargando(true);
        try {
          const payload = {
            clienteId: clienteId ? parseInt(clienteId, 10) : null,
            formaPago,
            productos: itemsVenta.map((it) => ({ productoId: it.productoId, cantidad: it.cantidad }))
          };

          const res = await fetch('/api/ventas', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (!res.ok) {
            throw new Error(data.error?.mensaje || 'Error al procesar la venta');
          }

          mostrarToast(`¡Venta #${data.numero} confirmada con éxito!`);
          setComprobanteGenerado(data);
          setItemsVenta([]);
          fetch('/api/productos?activo=true')
            .then((r) => r.json())
            .then((d) => setProductos(d.datos || []));
        } catch (err) {
          mostrarToast(err.message, 'error');
        } finally {
          setCargando(false);
        }
      }

      return (
        <div>
          <div className="heading-page">
            <div>
              <h1>Mostrador de ventas</h1>
              <p>Prepará y confirmá una venta en tiempo real con control atómico de stock.</p>
            </div>
          </div>

          <div className="pos-grid">
            {/* Columna Izquierda: Selección y Tabla de Productos */}
            <div className="card">
              <div className="card-header">
                <h2>Borrador de productos</h2>
                <span className="badge badge-neutral">{itemsVenta.length} ítems</span>
              </div>
              <div className="card-body">
                <div style={{ display: 'flex', gap: '10px', marginBottom: '20px' }}>
                  <select
                    className="form-control"
                    value={productoSeleccionado}
                    onChange={(e) => setProductoSeleccionado(e.target.value)}
                    style={{ flex: 1 }}
                  >
                    <option value="">-- Seleccionar producto para agregar --</option>
                    {productos.map((p) => (
                      <option key={p.id} value={p.id} disabled={p.stockActual <= 0}>
                        {p.codigo} — {p.nombre} ({formatoMoneda(p.precioVentaCentavos)}) · Stock: {p.stockActual}
                      </option>
                    ))}
                  </select>
                  <button className="btn" onClick={agregarProducto} disabled={!productoSeleccionado}>
                    + Agregar
                  </button>
                </div>

                {itemsVenta.length === 0 ? (
                  <div style={{ textAlign: 'center', padding: '48px 20px', color: '#94a3b8' }}>
                    <div style={{ fontSize: '36px', marginBottom: '10px' }}>🛍️</div>
                    <p style={{ margin: 0 }}>El borrador de venta está vacío.<br />Seleccioná productos del catálogo arriba.</p>
                  </div>
                ) : (
                  <div className="table-container">
                    <table>
                      <thead>
                        <tr>
                          <th>Producto</th>
                          <th style={{ textAlign: 'center' }}>Cantidad</th>
                          <th style={{ textAlign: 'right' }}>Precio Unit.</th>
                          <th style={{ textAlign: 'right' }}>Subtotal</th>
                          <th></th>
                        </tr>
                      </thead>
                      <tbody>
                        {itemsVenta.map((it) => (
                          <tr key={it.productoId}>
                            <td><strong>{it.descripcion}</strong></td>
                            <td style={{ textAlign: 'center' }}>
                              <div style={{ display: 'inline-flex', alignItems: 'center', gap: '6px' }}>
                                <button className="btn btn-secondary btn-sm" onClick={() => cambiarCantidad(it.productoId, -1)}>-</button>
                                <span style={{ fontWeight: 700, minWidth: '24px', textAlign: 'center' }}>{it.cantidad}</span>
                                <button className="btn btn-secondary btn-sm" onClick={() => cambiarCantidad(it.productoId, 1)}>+</button>
                              </div>
                            </td>
                            <td style={{ textAlign: 'right' }}>{formatoMoneda(it.precioUnitarioCentavos)}</td>
                            <td style={{ textAlign: 'right', fontWeight: 700 }}>{formatoMoneda(it.precioUnitarioCentavos * it.cantidad)}</td>
                            <td style={{ textAlign: 'right' }}>
                              <button className="btn btn-secondary btn-sm" style={{ color: 'var(--danger)' }} onClick={() => quitarItem(it.productoId)}>×</button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            </div>

            {/* Columna Derecha: Cliente, Pago y Resumen */}
            <div className="card">
              <div className="card-header">
                <h2>Cliente y Forma de Pago</h2>
              </div>
              <div className="card-body">
                <div className="form-group">
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '6px' }}>
                    <label style={{ margin: 0 }}>Cliente</label>
                    <button
                      type="button"
                      style={{ background: 'none', border: 0, color: 'var(--primary)', fontWeight: 700, fontSize: '12px', padding: 0 }}
                      onClick={() => setModalNuevoCliente(true)}
                    >
                      + Nuevo cliente
                    </button>
                  </div>
                  <select className="form-control" value={clienteId} onChange={(e) => setClienteId(e.target.value)}>
                    <option value="">Consumidor final</option>
                    {clientes.map((c) => (
                      <option key={c.id} value={c.id}>
                        {c.nombre} (Doc: {c.documento})
                      </option>
                    ))}
                  </select>
                </div>

                <div className="form-group">
                  <label>Forma de pago</label>
                  <div style={{ display: 'grid', gap: '8px' }}>
                    <label style={{ display: 'flex', alignItems: 'center', gap: '10px', padding: '10px 14px', border: '1px solid var(--border-color)', borderRadius: 'var(--radius-sm)', cursor: 'pointer', background: formaPago === 'CONTADO' ? 'var(--primary-light)' : '#fff' }}>
                      <input type="radio" name="formaPago" value="CONTADO" checked={formaPago === 'CONTADO'} onChange={() => setFormaPago('CONTADO')} />
                      <span style={{ fontWeight: 600 }}>💵 Contado / Efectivo</span>
                    </label>
                    <label style={{ display: 'flex', alignItems: 'center', gap: '10px', padding: '10px 14px', border: '1px solid var(--border-color)', borderRadius: 'var(--radius-sm)', cursor: 'pointer', background: formaPago === 'TARJETA' ? 'var(--primary-light)' : '#fff' }}>
                      <input type="radio" name="formaPago" value="TARJETA" checked={formaPago === 'TARJETA'} onChange={() => setFormaPago('TARJETA')} />
                      <span style={{ fontWeight: 600 }}>💳 Tarjeta (Simulada)</span>
                    </label>
                    <label style={{ display: 'flex', alignItems: 'center', gap: '10px', padding: '10px 14px', border: '1px solid var(--border-color)', borderRadius: 'var(--radius-sm)', cursor: 'pointer', background: formaPago === 'CUENTA_CORRIENTE' ? 'var(--primary-light)' : '#fff' }}>
                      <input type="radio" name="formaPago" value="CUENTA_CORRIENTE" checked={formaPago === 'CUENTA_CORRIENTE'} onChange={() => setFormaPago('CUENTA_CORRIENTE')} />
                      <span style={{ fontWeight: 600 }}>📋 Cuenta Corriente (A crédito)</span>
                    </label>
                  </div>
                  {formaPago === 'CUENTA_CORRIENTE' && !clienteId && (
                    <div style={{ marginTop: '8px', fontSize: '12px', color: 'var(--warning)', fontWeight: 600 }}>
                      ⚠️ La venta en cuenta corriente requiere seleccionar un cliente registrado arriba.
                    </div>
                  )}
                </div>

                <div style={{ borderTop: '1px solid var(--border-color)', paddingTop: '16px', marginTop: '20px' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', color: 'var(--text-muted)', marginBottom: '8px' }}>
                    <span>Subtotal</span>
                    <span>{formatoMoneda(totalCentavos)}</span>
                  </div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', borderTop: '2px solid var(--border-color)', paddingTop: '14px' }}>
                    <span style={{ fontSize: '15px', fontWeight: 700, color: 'var(--text-main)' }}>Total a cobrar</span>
                    <span style={{ fontFamily: 'Plus Jakarta Sans, sans-serif', fontSize: '24px', fontWeight: 800, color: 'var(--primary)' }}>
                      {formatoMoneda(totalCentavos)}
                    </span>
                  </div>

                  <button
                    className="btn"
                    style={{ width: '100%', marginTop: '20px', padding: '12px', fontSize: '14px', justifyContent: 'center' }}
                    onClick={confirmarVenta}
                    disabled={cargando || itemsVenta.length === 0 || (formaPago === 'CUENTA_CORRIENTE' && !clienteId)}
                  >
                    {cargando ? 'Procesando venta...' : 'Confirmar y emitir comprobante'}
                  </button>
                </div>
              </div>
            </div>
          </div>

          {/* Modal Nuevo Cliente sin perder venta */}
          {modalNuevoCliente && (
            <ModalNuevoCliente
              onCerrar={() => setModalNuevoCliente(false)}
              onClienteCreado={(nuevo) => {
                setClientes((prev) => [...prev, nuevo]);
                setClienteId(String(nuevo.id));
                setModalNuevoCliente(false);
                mostrarToast(`Cliente "${nuevo.nombre}" creado y seleccionado.`);
              }}
              mostrarToast={mostrarToast}
            />
          )}

          {/* Modal Comprobante Generado */}
          {comprobanteGenerado && (
            <ModalComprobante
              venta={comprobanteGenerado}
              onCerrar={() => {
                setComprobanteGenerado(null);
                onVentaGuardada();
              }}
            />
          )}
        </div>
      );
    }

    // Modal Dar de Alta Cliente desde Venta

      const [documento, setDocumento] = useState('');
      const [telefono, setTelefono] = useState('');
      const [correo, setCorreo] = useState('');

        e.preventDefault();
        setCargando(true);
        try {
          const res = await fetch('/api/clientes', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },

          });

                  <label>DNI o CUIT</label>

                </div>
                <div className="form-group">
                  <label>Teléfono (opcional)</label>
                  <input className="form-control" value={telefono} onChange={(e) => setTelefono(e.target.value)} placeholder="Ej. 381 555-1234" />

                  <label>Correo electrónico (opcional)</label>
                  <input className="form-control" type="email" value={correo} onChange={(e) => setCorreo(e.target.value)} placeholder="Ej. camila@ejemplo.com" />

                <button type="button" className="btn btn-secondary" onClick={onCerrar}>Cancelar</button>
                <button type="submit" className="btn" disabled={cargando}>
                  {cargando ? 'Guardando...' : 'Crear y seleccionar'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );

    // ----------------------------------------------------
    // VISTA 2: COMPROBANTES / HISTORIAL DE VENTAS
    // ----------------------------------------------------
    function VistaComprobantes({ mostrarToast }) {
      const [ventas, setVentas] = useState([]);
      const [ventaSeleccionada, setVentaSeleccionada] = useState(null);

      useEffect(() => {
        fetch('/api/ventas')
          .then((r) => r.json())
          .then((d) => setVentas(d.datos || []))
          .catch(() => mostrarToast('Error al cargar ventas', 'error'));
      }, []);

      async function verDetalle(id) {
        try {
          const res = await fetch(`/api/ventas/${id}`);
          const data = await res.json();
          if (res.ok) setVentaSeleccionada(data);

    // Modal Producto
    function ModalProducto({ producto, onCerrar, onGuardado, mostrarToast }) {
      const [codigo, setCodigo] = useState(producto ? producto.codigo : '');
      const [nombre, setNombre] = useState(producto ? producto.nombre : '');
      const [precioPesos, setPrecioPesos] = useState(producto ? (producto.precioVentaCentavos / 100).toFixed(2) : '');
      const [stockInicial, setStockInicial] = useState('0');
      const [activo, setActivo] = useState(producto ? producto.activo : true);
      const [cargando, setCargando] = useState(false);

      async function handleSubmit(e) {
        e.preventDefault();
        setCargando(true);
        try {
          const centavos = Math.round(parseFloat(precioPesos) * 100);
          if (isNaN(centavos) || centavos <= 0) {
            throw new Error('El precio debe ser un número positivo.');
          }

          if (producto) {
            const res = await fetch(`/api/productos/${producto.id}`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ codigo, nombre, precioVentaCentavos: centavos, activo })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error?.mensaje || 'Error al actualizar');
          } else {
            const res = await fetch('/api/productos', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ codigo, nombre, precioVentaCentavos: centavos, stockInicial: parseInt(stockInicial, 10), activo })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error?.mensaje || 'Error al crear');
          }
          onGuardado();
        } catch (err) {
          mostrarToast(err.message, 'error');
        } finally {
          setCargando(false);
        }
      }

      return (
        <div className="modal-overlay" onClick={onCerrar}>
          <div className="modal-card" onClick={(e) => e.stopPropagation()}>
            <div className="modal-header">
              <h3>{producto ? 'Editar producto' : 'Nuevo producto'}</h3>
              <button className="modal-close" onClick={onCerrar}>×</button>
            </div>
            <form onSubmit={handleSubmit}>
              <div className="modal-body">
                <div className="form-group">
                  <label>Código único</label>
                  <input className="form-control" value={codigo} onChange={(e) => setCodigo(e.target.value)} required placeholder="Ej. CAF-001" />
                </div>
                <div className="form-group">
                  <label>Descripción / Nombre</label>
                  <input className="form-control" value={nombre} onChange={(e) => setNombre(e.target.value)} required placeholder="Ej. Café molido 250 g" />
                </div>
                <div className="form-group">
                  <label>Precio de venta ($)</label>
                  <input className="form-control" type="number" step="0.01" min="0.01" value={precioPesos} onChange={(e) => setPrecioPesos(e.target.value)} required placeholder="Ej. 6500.00" />
                </div>
                {!producto && (
                  <div className="form-group">
                    <label>Stock inicial (unidades)</label>
                    <input className="form-control" type="number" min="0" value={stockInicial} onChange={(e) => setStockInicial(e.target.value)} required />
                  </div>
                )}
                <div className="form-group">
                  <label>Estado de comercialización</label>
                  <select className="form-control" value={activo ? '1' : '0'} onChange={(e) => setActivo(e.target.value === '1')}>
                    <option value="1">Activo (Disponible para venta)</option>
                    <option value="0">Inactivo (Desactivado)</option>
                  </select>
                </div>
              </div>
              <div className="modal-footer">
                <button type="button" className="btn btn-secondary" onClick={onCerrar}>Cancelar</button>
                <button type="submit" className="btn" disabled={cargando}>
                  {cargando ? 'Guardando...' : 'Guardar producto'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // Modal Cuenta Corriente y Cobranzas
    function ModalCuentaCorriente({ cliente, onCerrar, onActualizarClientes, mostrarToast }) {
      const [ctaCte, setCtaCte] = useState(null);
      const [mostrarFormPago, setMostrarFormPago] = useState(false);
      const [importePago, setImportePago] = useState('');
      const [observacion, setObservacion] = useState('');
      const [cargando, setCargando] = useState(false);

      function cargarCtaCte() {
        fetch(`/api/clientes/${cliente.id}/cuenta-corriente`)
          .then((r) => r.json())
          .then((d) => setCtaCte(d));
      }

      useEffect(() => {
        cargarCtaCte();
      }, [cliente.id]);

      async function registrarPago(e) {
        e.preventDefault();
        setCargando(true);
        try {
          const centavos = Math.round(parseFloat(importePago) * 100);
          if (isNaN(centavos) || centavos <= 0) {
            throw new Error('El importe debe ser mayor a cero.');
          }

          const res = await fetch(`/api/clientes/${cliente.id}/pagos`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              fecha: new Date().toISOString(),
              importeCentavos: centavos,
              observacion
            })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error?.mensaje || 'Error al registrar pago');

          mostrarToast('Pago registrado correctamente.');
          setMostrarFormPago(false);
          setImportePago('');
          setObservacion('');
          cargarCtaCte();
          onActualizarClientes();
        } catch (err) {
          mostrarToast(err.message, 'error');
        } finally {
          setCargando(false);
        }
      }

      return (
        <div className="modal-overlay" onClick={onCerrar}>
          <div className="modal-card" style={{ maxWidth: '640px' }} onClick={(e) => e.stopPropagation()}>
            <div className="modal-header">
              <div>
                <h3>Cuenta Corriente — {cliente.nombre}</h3>
                <div style={{ fontSize: '12px', color: 'var(--text-muted)' }}>Documento: {cliente.documento}</div>
              </div>
              <button className="modal-close" onClick={onCerrar}>×</button>
            </div>
            <div className="modal-body">
              {/* Saldo destacado */}
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '16px 20px', background: '#f8fafc', border: '1px solid var(--border-color)', borderRadius: 'var(--radius-sm)', marginBottom: '20px' }}>
                <div>
                  <div style={{ fontSize: '11px', textTransform: 'uppercase', letterSpacing: '0.8px', color: 'var(--text-muted)', fontWeight: 700 }}>Saldo adeudado</div>
                  <div style={{ fontFamily: 'Plus Jakarta Sans, sans-serif', fontSize: '26px', fontWeight: 800, color: ctaCte?.saldoCentavos > 0 ? 'var(--danger)' : 'var(--success)' }}>
                    {formatoMoneda(ctaCte?.saldoCentavos)}
                  </div>
                </div>
                {ctaCte?.saldoCentavos > 0 && !mostrarFormPago && (
                  <button className="btn" onClick={() => { setMostrarFormPago(true); setImportePago((ctaCte.saldoCentavos / 100).toFixed(2)); }}>
                    + Registrar pago
                  </button>
                )}
              </div>

              {/* Formulario de Pago */}
              {mostrarFormPago && (
                <form onSubmit={registrarPago} style={{ background: '#fff', border: '1px solid var(--border-color)', borderRadius: 'var(--radius-sm)', padding: '16px', marginBottom: '20px' }}>
                  <h4 style={{ margin: '0 0 12px', fontSize: '14px' }}>Registrar cobro</h4>
                  <div className="form-group">
                    <label>Importe a cobrar ($)</label>
                    <input
                      className="form-control"
                      type="number"
                      step="0.01"
                      min="0.01"
                      max={(ctaCte.saldoCentavos / 100).toFixed(2)}
                      value={importePago}
                      onChange={(e) => setImportePago(e.target.value)}
                      required
                    />
                    <small style={{ color: 'var(--text-muted)' }}>Límite máximo cancelable: {formatoMoneda(ctaCte.saldoCentavos)}</small>
                  </div>
                  <div className="form-group">
                    <label>Observación (opcional)</label>
                    <input className="form-control" value={observacion} onChange={(e) => setObservacion(e.target.value)} placeholder="Ej. Pago en efectivo, transferencia..." />
                  </div>
                  <div style={{ display: 'flex', justifyContent: 'flex-end', gap: '8px' }}>
                    <button type="button" className="btn btn-secondary btn-sm" onClick={() => setMostrarFormPago(false)}>Cancelar</button>
                    <button type="submit" className="btn btn-sm" disabled={cargando}>
                      {cargando ? 'Guardando...' : 'Confirmar cobro'}
                    </button>
                  </div>
                </form>
              )}

              {/* Tabla de movimientos */}
              <h4 style={{ margin: '0 0 10px', fontSize: '12px', textTransform: 'uppercase', color: 'var(--text-muted)', letterSpacing: '0.6px', fontWeight: 700 }}>Historial de cuenta</h4>
              <div className="table-container" style={{ maxHeight: '250px' }}>
                <table>
                  <thead>
                    <tr>
                      <th>Fecha</th>
                      <th>Tipo</th>
                      <th>Detalle</th>
                      <th style={{ textAlign: 'right' }}>Importe</th>
                    </tr>
                  </thead>
                  <tbody>
                    {!ctaCte?.movimientos || ctaCte.movimientos.length === 0 ? (
                      <tr>
                        <td colSpan="4" style={{ textAlign: 'center', padding: '20px', color: '#94a3b8' }}>
                          No hay movimientos en esta cuenta corriente.
                        </td>
                      </tr>
                    ) : (
                      ctaCte.movimientos.map((m, idx) => (
                        <tr key={idx}>
                          <td>{formatoFecha(m.fecha)}</td>
                          <td>
                            <span className={`badge ${m.tipo === 'VENTA' ? 'badge-danger' : 'badge-success'}`}>
                              {m.tipo}
                            </span>
                          </td>
                          <td>
                            {m.tipo === 'VENTA' ? `Venta #${m.numeroComprobante || m.ventaId}` : (m.observacion || 'Cobro registrado')}
                          </td>
                          <td style={{ textAlign: 'right', fontWeight: 700, color: m.tipo === 'VENTA' ? 'var(--danger)' : 'var(--success)' }}>
                            {m.tipo === 'VENTA' ? `+${formatoMoneda(m.importeCentavos)}` : `-${formatoMoneda(m.importeCentavos)}`}
                          </td>
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>
              </div>
            </div>
            <div className="modal-footer">
              <button className="btn" onClick={onCerrar}>Cerrar</button>
            </div>
          </div>
        </div>
      );
    }

    // ----------------------------------------------------
    // VISTA 6: ADMINISTRACIÓN DE USUARIOS
    // ----------------------------------------------------
    function VistaUsuarios({ mostrarToast, usuarioActual }) {
      const [usuarios, setUsuarios] = useState([]);
      const [modalUsuario, setModalUsuario] = useState(null);

      function cargar() {
        fetch('/api/usuarios')
          .then((r) => r.json())
          .then((d) => setUsuarios(d.datos || []));
      }

      useEffect(() => {
        cargar();
      }, []);

      return (
        <div>
          <div className="heading-page">
            <div>
              <h1>Administración de usuarios</h1>
              <p>Control de accesos y perfiles (Exclusivo Administradores).</p>
            </div>
            <button className="btn" onClick={() => setModalUsuario('nuevo')}>+ Nuevo usuario</button>
          </div>

          <div className="card">
            <div className="table-container">
              <table>
                <thead>
                  <tr>
                    <th>Nombre</th>
                    <th>Acceso / Correo</th>
                    <th>Perfil</th>
                    <th style={{ textAlign: 'center' }}>Estado</th>
                    <th style={{ textAlign: 'right' }}>Acciones</th>
                  </tr>
                </thead>
                <tbody>
                  {usuarios.map((u) => (
                    <tr key={u.id}>
                      <td><strong>{u.nombre}</strong></td>
                      <td>{u.acceso}</td>
                      <td>
                        <span className={`badge ${u.administrador ? 'badge-success' : 'badge-neutral'}`}>
                          {u.administrador ? 'Administrador' : 'Operador'}
                        </span>
                      </td>
                      <td style={{ textAlign: 'center' }}>
                        <span className={`badge ${u.activo ? 'badge-success' : 'badge-danger'}`}>
                          {u.activo ? 'Activo' : 'Inactivo'}
                        </span>
                      </td>
                      <td style={{ textAlign: 'right' }}>
                        <button className="btn btn-secondary btn-sm" onClick={() => setModalUsuario(u)}>
                          ✏️ Editar
                        </button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          {modalUsuario && (
            <ModalUsuario
              usuario={modalUsuario === 'nuevo' ? null : modalUsuario}
              usuarioActual={usuarioActual}
              onCerrar={() => setModalUsuario(null)}
              onGuardado={() => { setModalUsuario(null); cargar(); mostrarToast('Usuario guardado.'); }}
              mostrarToast={mostrarToast}
            />
          )}
        </div>
      );
    }

    // Modal Usuario
    function ModalUsuario({ usuario, usuarioActual, onCerrar, onGuardado, mostrarToast }) {
      const [nombre, setNombre] = useState(usuario ? usuario.nombre : '');
      const [acceso, setAcceso] = useState(usuario ? usuario.acceso : '');
      const [contrasena, setContrasena] = useState('');
      const [administrador, setAdministrador] = useState(usuario ? usuario.administrador : false);
      const [activo, setActivo] = useState(usuario ? usuario.activo : true);
      const [cargando, setCargando] = useState(false);

      async function handleSubmit(e) {
        e.preventDefault();
        setCargando(true);
        try {
          if (usuario) {
            const res = await fetch(`/api/usuarios/${usuario.id}`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ nombre, acceso, administrador, activo })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error?.mensaje || 'Error al actualizar');
          } else {
            const res = await fetch('/api/usuarios', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ nombre, acceso, contrasena, administrador, activo })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error?.mensaje || 'Error al crear');
          }
          onGuardado();
        } catch (err) {
          mostrarToast(err.message, 'error');
        } finally {
          setCargando(false);
        }
      }

      return (
        <div className="modal-overlay" onClick={onCerrar}>
          <div className="modal-card" onClick={(e) => e.stopPropagation()}>
            <div className="modal-header">
              <h3>{usuario ? 'Editar usuario' : 'Nuevo usuario'}</h3>
              <button className="modal-close" onClick={onCerrar}>×</button>
            </div>
            <form onSubmit={handleSubmit}>
              <div className="modal-body">
                <div className="form-group">
                  <label>Nombre y apellido</label>
                  <input className="form-control" value={nombre} onChange={(e) => setNombre(e.target.value)} required />
                </div>
                <div className="form-group">
                  <label>Correo o nombre de acceso</label>
                  <input className="form-control" value={acceso} onChange={(e) => setAcceso(e.target.value)} required />
                </div>
                {!usuario && (
                  <div className="form-group">
                    <label>Contraseña inicial</label>
                    <input className="form-control" type="password" value={contrasena} onChange={(e) => setContrasena(e.target.value)} required />
                  </div>
                )}
                <div className="form-group">
                  <label>Perfil</label>
                  <select className="form-control" value={administrador ? '1' : '0'} onChange={(e) => setAdministrador(e.target.value === '1')}>
                    <option value="0">Operador (Ventas, inventario, clientes y cobranzas)</option>
                    <option value="1">Administrador (Control total + Usuarios)</option>
                  </select>
                </div>
                <div className="form-group">
                  <label>Estado</label>
                  <select className="form-control" value={activo ? '1' : '0'} onChange={(e) => setActivo(e.target.value === '1')}>
                    <option value="1">Activo</option>
                    <option value="0">Inactivo (Acceso revocado)</option>
                  </select>
                </div>
              </div>
              <div className="modal-footer">
                <button type="button" className="btn btn-secondary" onClick={onCerrar}>Cancelar</button>
                <button type="submit" className="btn" disabled={cargando}>
                  {cargando ? 'Guardando...' : 'Guardar usuario'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // Montar aplicación
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
